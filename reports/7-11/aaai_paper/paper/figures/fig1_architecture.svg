<svg width="700" height="166" viewBox="0 58 700 166" role="img" xmlns="http://www.w3.org/2000/svg"><title>Physics injection into the LeWM shared-latent world model</title><desc>The encoder maps frames to 192-dimensional latents. A black-box transformer predicts all 192 dimensions while a kinematic head separately predicts the 2-dimensional position slot; the two are concatenated into the predicted latent, aligned to the encoded next latent by MSE, with SIGReg preventing collapse. The right panel lists the three physics injection mechanisms.</desc>
